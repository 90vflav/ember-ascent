name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack files
        run: |
          for f in index package capacitor.config; do 7z x -y "$f.7z"; done
          mkdir -p www
          cp index.html www/
          sed -i 's#</style>#[hidden]{display:none!important}</style>#' www/index.html
          sed -i 's#s\.innerHTML=html;s\.hidden=false;#s.innerHTML=html;s.hidden=false;s.style.display="flex";#' www/index.html
          sed -i "s#function hideScreen(){\$('screen').hidden=true;}#function hideScreen(){var s=\$('screen');s.hidden=true;s.style.display='none';}#" www/index.html
          sed -i 's#A mountain in eight rooms#v2 - A mountain in eight rooms#' www/index.html
          grep -c "v2 - A mountain" www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ember-ascent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
